name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
  hygiene:
    name: Secrets and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --config .gitleaks.toml
      - run: pipx run --spec zizmor==1.30.1 zizmor --min-severity low --min-confidence medium .github/workflows
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: go run github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.0 run --check
